<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14315B">
<title>หมอเห็ด by ARAKHA</title>
<link rel="manifest" href="manifest.json">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14315B; --surface:#EFEDE6; --card:#F8F7F3; --straw:#14315B; --clinic:#14315B; --clinic-dark:#0E2340; --navy-soft:#E1E4EA;
  --pest:#B3261E; --maybe:#B8741A; --ok:#2E7D5B; --unknown:#5F6B7A; --line:#D9D6CC; --muted:#5F6B7A;
  --r:14px;
}
*{box-sizing:border-box} html,body{margin:0;background:var(--surface);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3,.brand{font-family:Kanit,Sarabun,sans-serif;font-weight:600;letter-spacing:.01em;margin:0}
header{background:#F8F7F3;padding:10px 16px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;position:sticky;top:0;z-index:5;border-bottom:4px solid var(--clinic)}
header .logo{height:54px;width:auto;display:block}
header small{font-family:Sarabun;font-weight:400;color:var(--muted);font-size:13px}
main{padding:16px 16px 120px;max-width:560px;margin:0 auto}
section.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.eyebrow{font-size:13px;color:var(--muted);text-transform:none;margin-bottom:6px}
h2{font-size:19px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#F8F7F3;border-radius:999px;padding:10px 14px;font:inherit;font-size:16px;color:var(--ink);min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--clinic);background:var(--navy-soft);color:var(--clinic-dark);font-weight:600}
.chip:focus-visible,button:focus-visible{outline:3px solid #8FA3C4;outline-offset:2px}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tray .slot{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;background:#E7E4DB;border:1px dashed var(--line)}
.tray img{width:100%;height:100%;object-fit:cover;display:block}
.tray .rm{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:26px;height:26px;font-size:16px}
.tray .roi{position:absolute;left:4px;bottom:4px;background:var(--pest);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px}
.tray .badge{position:absolute;left:4px;top:4px;background:rgba(20,49,91,.85);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px}
.add{display:flex;gap:10px;margin-top:10px}
.add label{flex:1;display:grid;place-items:center;min-height:56px;border:2px solid var(--clinic);color:var(--clinic);border-radius:12px;font-weight:600;cursor:pointer}
.add input{display:none}
.roi-row{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px;color:var(--muted)}
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--surface) 30%)}
.cta button,.btn{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--clinic);color:#fff;font:inherit;font-size:18px;font-weight:600;font-family:Kanit}
.btn.secondary{background:#F8F7F3;color:var(--clinic);border:2px solid var(--clinic)}
.btn.line{background:#06C755}
button:disabled{opacity:.45}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
/* result slip */
.slip{border-left:6px solid var(--unknown)}
.slip.pest{border-left-color:var(--pest)} .slip.possible_pest{border-left-color:var(--maybe)} .slip.harmless{border-left-color:var(--ok)}
.slip .cls{font-size:13px;font-weight:600;letter-spacing:.02em}
.slip.pest .cls{color:var(--pest)} .slip.possible_pest .cls{color:var(--maybe)} .slip.harmless .cls{color:var(--ok)} .slip.unknown .cls{color:var(--unknown)}
.conf{display:inline-block;font-size:13px;color:var(--muted);margin-left:6px}
.feat{font-size:15px;color:var(--muted);margin:4px 0 8px}
.ladder{list-style:none;padding:0;margin:8px 0 0;counter-reset:rung}
.ladder>li{position:relative;padding:8px 0 8px 46px;border-top:1px solid var(--line)}
.ladder>li::before{counter-increment:rung;content:counter(rung);position:absolute;left:0;top:10px;width:32px;height:32px;border-radius:8px;background:var(--navy-soft);display:grid;place-items:center;font-family:Kanit;font-weight:600;color:var(--clinic-dark)}
.ladder .rung{font-family:Kanit;font-weight:500;font-size:15px;color:var(--muted)}
.ladder ul{margin:4px 0 0;padding-left:18px} .ladder li li{margin:3px 0}
.note{font-size:14px;color:var(--maybe)}
.ladder .chem{color:var(--muted)}
.ask{background:#F3EBD6;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:15px}
.evi{background:#fff8e6;border:1px solid #e6d3a3;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.lookalike{background:#fdf0ef;border:1px solid #e4b7b3;border-radius:10px;padding:10px 12px;margin:8px 0}
.green{background:#eef7ee;border:1px solid #bcd9bc;border-radius:10px;padding:10px 12px;margin:8px 0}
.green b{font-family:Kanit;color:#1d5c2e;display:block;margin-bottom:4px}
.gate{background:#fff7ea;border:1px solid #ecd9b0;border-radius:10px;padding:10px 12px;margin:8px 0}
.gate b{font-family:Kanit;color:#7a4d00;display:block;margin-bottom:4px}
.ask b{display:block;margin-bottom:2px}
.actions{display:grid;gap:10px;margin-top:8px}
.fb{margin-top:10px;font-size:14px;color:var(--muted)}
.fb button{background:none;border:0;color:var(--clinic);font:inherit;text-decoration:underline;padding:0}
.grade{font-size:12px;border-radius:6px;padding:1px 6px;margin-left:6px;background:#E7E4DB;color:var(--muted);vertical-align:middle}
.grade.gA{background:#E3F3E5;color:var(--ok)} .grade.gB{background:var(--navy-soft);color:var(--clinic-dark)} .grade.gC,.grade.gD{background:#FFF3DF;color:var(--maybe)}
.shop{display:grid;gap:8px} .prod{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--ink);font-size:15px}
.prod .v{font-family:Kanit;font-size:12px;padding:2px 8px;border-radius:6px;color:#fff;background:var(--muted)} .v.shopee{background:#EE4D2D} .v.lazada{background:#0F146D} .v.arakha{background:var(--clinic-dark)}
.refs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory} .ref{flex:0 0 200px;margin:0;scroll-snap-align:start} .ref img{width:200px;height:150px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#E7E4DB} .ref figcaption{font-size:13px;line-height:1.35;margin-top:4px} .ref small{display:block;color:var(--muted);font-size:11px}
.beh{font-size:15px;margin:6px 0 0}
.reflink{text-decoration:none;color:var(--ink)} .reflink-box{width:200px;height:150px;border-radius:8px;border:1.5px dashed var(--clinic);display:grid;place-items:center;text-align:center;color:var(--clinic);font-weight:600;font-size:15px;background:var(--navy-soft)}
.zooms{display:grid;grid-template-columns:repeat(3,1fr);gap:6px} .zoom{width:100%;border-radius:8px;border:1px solid var(--line);background:#E7E4DB}
.protocol{background:var(--navy-soft);border-radius:10px;padding:10px 12px;margin-top:8px} .protocol ol{margin:4px 0 0;padding-left:20px}
.spinner{display:grid;place-items:center;padding:40px 0;color:var(--muted)}
#ver{margin:18px 0 8px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.spinner i{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--clinic);border-radius:50%;animation:s 1s linear infinite;display:block;margin-bottom:10px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner i{animation:none}}
.err{background:#FDECEA;color:var(--pest);border-radius:10px;padding:10px 12px}
.hidden{display:none}
</style>
</head>

<script>
// API location: web/config.js (generated at deploy) sets window.MORHED_API. No config / local file / ?demo → demo mode.
const FN = /supabase\.co$/.test(location.hostname) ? location.origin + "/functions/v1/morhed" : "";
const API_BASE = (!new URLSearchParams(location.search).has("demo") && (window.MORHED_API || FN)) || "";
const LIFF_ID  = "2011292044-C3WWucnv"; // LINE Login channel → LIFF app. Used only when opened inside LINE; on the plain web URL the app works without login.
const S = { species:null, system:null, answers:{}, media:[], ctx:null, line_user_id:null };
async function initLiff(){
  if (!LIFF_ID) return;
  const inLine = /\bLine\//.test(navigator.userAgent) || new URLSearchParams(location.search).has("liff.state") || location.search.includes("liffClientId");
  if (!inLine) return;
  await new Promise((ok,err)=>{const t=document.createElement("script"); t.src="https://static.line-scdn.net/liff/edge/2/sdk.js"; t.onload=ok; t.onerror=err; document.head.appendChild(t);});
  try { await liff.init({ liffId: LIFF_ID }); if (!liff.isLoggedIn()) { liff.login(); return; } S.line_user_id = (await liff.getProfile()).userId; } catch(e){ console.warn("liff", e); }
}

async function loadCtx(){
  S.ctx = DEMO_CTX; renderAll();
  if (API_BASE) { try { const c = await (await fetch(API_BASE+"/api/context")).json(); if (c && c.species) { S.ctx = c; renderAll(); } } catch(_) {} }
}
function renderAll(){
  renderChips("species", S.ctx.species, v=>{S.species=v; gate();});
  renderChips("system", S.ctx.systems, v=>{S.system=v; gate();});
  const q = document.getElementById("questions"); q.innerHTML="";
  S.ctx.intake_questions.forEach(qq=>{
    const h=document.createElement("h2"); h.textContent=qq.th; h.style.marginTop="8px"; q.appendChild(h);
    const d=document.createElement("div"); d.className="chips"; d.id="q-"+qq.id; q.appendChild(d);
    renderChips(d.id, qq.options.map(o=>({id:o.value,th:o.th})), v=>{S.answers[qq.id]=v;});
  });
}
function renderChips(id, items, onPick){
  const el=document.getElementById(id); el.innerHTML="";
  items.forEach(it=>{
    const b=document.createElement("button"); b.className="chip"; b.type="button"; b.textContent=it.th; b.setAttribute("aria-pressed","false");
    b.onclick=()=>{[...el.children].forEach(c=>c.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); onPick(it.id);};
    el.appendChild(b);
  });
}
function gate(){ document.getElementById("go").disabled = !(S.species && S.system && S.media.length); }

// ---- media intake: resize images, sample 3 frames from video
document.getElementById("cam").onchange = e=>addFiles(e.target.files);
document.getElementById("pick").onchange = e=>addFiles(e.target.files);
// One tile per file. A video is ONE item to the user; internally it becomes 2 frames (same group id) for the model.
async function addFiles(files){
  for (const f of files){
    if (groups().length>=4) { alert("ใส่ได้สูงสุด 4 รายการ"); break; }
    const g=crypto.randomUUID();
    if (f.type.startsWith("video/")) { const frs=await videoFrames(f,2); if(!frs.length){ alert("อ่านวิดีโอไม่ได้ ลองถ่ายภาพนิ่งแทน"); continue; } frs.forEach(fr=>S.media.push({...fr,group:g,kind:"video"})); }
    else { const im=shrink(await loadImg(URL.createObjectURL(f))); if(im) S.media.push({...im,group:g,kind:"image"}); }
  }
  renderTray(); gate();
}
const groups=()=>[...new Set(S.media.map(m=>m.group))];
function loadImg(src){ return new Promise(r=>{const i=new Image(); i.onload=()=>r(i); i.src=src;}); }
function shrink(img, max=1024, q=.8){
  const w=img.videoWidth||img.naturalWidth||img.width, h=img.videoHeight||img.naturalHeight||img.height;
  if (!w||!h) return null;
  const c=document.createElement("canvas"); const k=Math.min(1,max/Math.max(w,h));
  c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  const url=c.toDataURL("image/jpeg",q); return {media_type:"image/jpeg", data:url.split(",")[1], url};
}
const FRAME_EVERY=4, MAX_PER_VIDEO=12, MAX_MEDIA=20;
// Extract a frame every FRAME_EVERY seconds. Works on iOS Safari: video must be in the DOM, muted, playsinline, and touched by play() once.
function videoFrames(file){
  return new Promise(res=>{
    const v=document.createElement("video"); v.muted=true; v.setAttribute("muted",""); v.setAttribute("playsinline",""); v.playsInline=true; v.preload="auto";
    v.style.cssText="position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:-10px"; document.body.appendChild(v);
    v.src=URL.createObjectURL(file);
    const out=[]; let done=false; const finish=()=>{ if(!done){done=true; v.remove(); res(out.filter(Boolean));} };
    setTimeout(finish, 40000); v.onerror=finish;
    const once=(ev)=>new Promise(r=>{ const h=()=>{v.removeEventListener(ev,h); r();}; v.addEventListener(ev,h); setTimeout(r,4000); });
    v.onloadedmetadata=async()=>{
      try{
        try{ const pl=v.play(); if(pl) await pl; await once("timeupdate"); v.pause(); }catch(_){}
        if (!v.videoWidth) await once("loadeddata");
        const d=isFinite(v.duration)&&v.duration>0?v.duration:8;
        const times=[]; for(let t=0.2;t<d&&times.length<MAX_PER_VIDEO;t+=FRAME_EVERY) times.push(t);
        if (d>0.5 && times.length<MAX_PER_VIDEO) times.push(Math.max(0.2,d-0.3));
        for (const t of times){ v.currentTime=t; await once("seeked"); out.push(shrink(v)); }
      }catch(_){} finish();
    };
    v.load();
  });
}
async function addFiles(files){
  for (const f of files){
    if (groups().length>=4) { alert("ใส่ได้สูงสุด 4 รายการ"); break; }
    const g=crypto.randomUUID();
    if (f.type.startsWith("video/")) { const frs=await videoFrames(f); if(!frs.length){ alert("อ่านวิดีโอไม่ได้ ลองถ่ายภาพนิ่งแทน"); continue; } frs.forEach(fr=>{ if(S.media.length<MAX_MEDIA) S.media.push({...fr,group:g,kind:"video"}); }); }
    else { const im=shrink(await loadImg(URL.createObjectURL(f))); if(im && S.media.length<MAX_MEDIA) S.media.push({...im,group:g,kind:"image"}); }
  }
  renderTray(); gate();
}

function renderTray(){
  const t=document.getElementById("tray"); t.innerHTML="";
  const roi=document.getElementById("roi").checked;
  groups().forEach((g,i)=>{
    const m=S.media.find(x=>x.group===g);
    const d=document.createElement("div"); d.className="slot";
    const n=S.media.filter(x=>x.group===g).length;
    d.innerHTML=`<img src="${m.url}" alt="รายการที่ ${i+1}"><button class="rm" aria-label="ลบ">×</button>${m.kind==="video"?`<span class="badge">▶ วิดีโอ · ${n} เฟรม</span>`:''}${roi?'<span class="roi">จุดสนใจ</span>':''}`;
    d.querySelector(".rm").onclick=()=>{S.media=S.media.filter(x=>x.group!==g); renderTray(); gate();};
    t.appendChild(d);
  });
}
document.getElementById("roi").onchange=renderTray;

document.getElementById("go").onclick = async ()=>{
  const res=document.getElementById("s-result"); document.getElementById("s-intake").classList.add("hidden");
  document.getElementById("cta").classList.add("hidden"); res.classList.remove("hidden");
  res.innerHTML=`<div class="spinner"><i></i>กำลังรับการวินิจฉัย…</div>`;
  const roi=document.getElementById("roi").checked;
  const body={species:S.species, system:S.system, answers:S.answers, parent_incident:S.parent||null, line_user_id:S.line_user_id, media:S.media.map(m=>({media_type:m.media_type,data:m.data,roi}))};
  try{
    const r = API_BASE ? await (await fetch(API_BASE+"/api/incident",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)})).json()

};

// Zoomed crops of where the model looked (bbox from the model, drawn on our own uploaded images). Works for sure and unsure cases alike.
function zooms(o){
  const idxs=(o.media_indices&&o.media_indices.length?o.media_indices:[o.media_index??0]).slice(0,3);
  const cells=idxs.map((mi,k)=>{ const m=S.media[mi]; if(!m) return ""; const id="z"+Math.random().toString(36).slice(2);
    setTimeout(()=>drawZoom(id,m.url,k===0?o.bbox:null),0); return `<canvas id="${id}" class="zoom"></canvas>`; }).join("");
  return cells?`<div class="eyebrow" style="margin-top:8px">จุดที่หมอเห็ดดู</div><div class="zooms">${cells}</div>`:"";
}
const STAGE={adult:"ตัวเต็มวัย",larva:"หนอน/ตัวอ่อน",damage:"ความเสียหาย",habitat:"ที่พบ",lookalike:"ตัวที่คล้ายกัน"};
// Reference gallery: real photos from the KB / our verified farm cases, plus behaviour text, so the farmer can judge the ID
function references(o){
  if (!o.reference_images?.length && !o.behaviour_th) return "";
  const imgs=(o.reference_images||[]).map(r=> r.mode==="link"
    ? `<a class="ref reflink" href="${r.url}" target="_blank" rel="noopener"><div class="reflink-box">🔗<br>เปิดดูภาพที่ต้นทาง</div><figcaption><b>${STAGE[r.stage]||r.stage}</b> ${r.caption_th||""}<small>${r.source_th||""}</small></figcaption></a>`
    : `<figure class="ref"><img src="${r.url}" alt="${STAGE[r.stage]||r.stage}" loading="lazy"><figcaption><b>${STAGE[r.stage]||r.stage}</b> ${r.caption_th||""}<small>${r.credit||""}${r.license?` · ${r.license}`:""}</small></figcaption></figure>`).join("");
  return `<div class="eyebrow" style="margin-top:10px">เทียบกับภาพอ้างอิง — ใช่ตัวเดียวกันไหม?</div>${imgs?`<div class="refs">${imgs}</div>`:""}${o.behaviour_th?`<p class="beh"><b>นิสัย/พฤติกรรม:</b> ${o.behaviour_th}</p>`:""}`;
}
function drawZoom(id,url,bbox){
  const c=document.getElementById(id); if(!c) return; const img=new Image(); img.onload=()=>{
    const W=img.width,H=img.height; let x=0,y=0,w=W,h=H;
    if (bbox&&bbox.length===4){ const pad=0.6; x=Math.max(0,(bbox[0]-bbox[2]*pad)*W); y=Math.max(0,(bbox[1]-bbox[3]*pad)*H); w=Math.min(W-x,bbox[2]*(1+2*pad)*W); h=Math.min(H-y,bbox[3]*(1+2*pad)*H); }
    const size=360; c.width=size; c.height=Math.round(size*h/w); const g=c.getContext("2d"); g.drawImage(img,x,y,w,h,0,0,c.width,c.height);
    if (bbox&&bbox.length===4){ g.strokeStyle="#B3261E"; g.lineWidth=3; g.strokeRect((bbox[0]*W-x)*c.width/w,(bbox[1]*H-y)*c.height/h,bbox[2]*W*c.width/w,bbox[3]*H*c.height/h); }
  }; img.src=url;
}

function rung(label,steps,chem){
  const g=s=>s.grade?`<span class="grade g${s.grade}">หลักฐาน ${s.grade}${s.crop_specific?'':'*'}</span>`:"";
  const items = steps.map(s=>`<li>${s.th} ${g(s)}${s.application_th?`<div class="feat">${s.application_th}</div>`:""}${s.note_th?`<div class="note">${s.note_th}</div>`:""}</li>`).join("");
  return `<li><div class="rung">${label}</div><ul${chem?' class="chem"':''}>${items||"<li>—</li>"}</ul></li>`;
}
// Product layer: rendered AFTER the plan, from the treatment ids, never the other way round
function productBlock(p,r){
  const rows=[]; for (const k of ["hygiene","physical","biological"]) for (const s of p.ladder[k]) for (const pr of (s.products||[])) rows.push({s,pr});
  if (!rows.length) return "";
  return `<div class="eyebrow" style="margin-top:12px">ของที่ต้องใช้</div><div class="shop">${rows.map(({s,pr})=>
    `<a class="prod" href="${pr.url}" target="_blank" rel="noopener sponsored" onclick="click_('${s.id}','${pr.vendor}')"><span class="v ${pr.vendor}">${{shopee:'Shopee',lazada:'Lazada',arakha:'ARAKHA'}[pr.vendor]||pr.vendor}</span>${pr.th}</a>`).join("")}</div>
    <div class="hint">${r.disclosure_th||""}</div>`;
}

function showProvisional(id){
  const sus=(S.lastResult.suspects||[]).find(x=>x.id===id); if(!sus) return;
  const el=document.getElementById("prov-"+id); const p=sus.plan;
  el.innerHTML=`<div class="ask" style="margin-top:10px"><b>คำแนะนำเบื้องต้น — ใช้ได้เฉพาะเมื่อคุณค่อนข้างแน่ใจว่าเป็น ${sus.name_th}</b>ขั้นสุขอนามัยและกายภาพปลอดภัยทำได้เลย ขั้นชีวภาพรอยืนยันก่อนซื้อ</div>
    <ol class="ladder">${rung("สุขอนามัย",p.ladder.hygiene)}${rung("กายภาพ",p.ladder.physical)}${rung("ชีวภาพ (รอยืนยัน)",p.ladder.biological)}${rung("สารเคมี",p.ladder.chemical,true)}</ol>${productBlock(p,S.lastResult)}`;
  el.classList.remove("hidden");
  if (API_BASE && S.incident) fetch(API_BASE+"/api/click",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({incident_id:S.incident,treatment_id:"provisional_plan",vendor:id})});
}
async function feedback(i, fb){
  let correction=null;
  if (fb==="deny"){
    const opts=["ไม่รู้ว่าตัวอะไร","ไม่ใช่สิ่งมีชีวิต (เศษวัสดุ/คราบ)","แมลงหวี่เห็ด","แมลงวันหลังค่อม","ไร","แมลงหางดีด","กิ้งกือ/ตะขาบ","อื่น ๆ (พิมพ์)"];
    const pick=prompt("คิดว่าเป็นอะไร? พิมพ์ตัวเลข\n"+opts.map((o,k)=>`${k+1}. ${o}`).join("\n")); if(!pick) return;
    const k=parseInt(pick,10); correction = k>=1&&k<=opts.length ? (k===opts.length ? (prompt("พิมพ์ชื่อ")||"other") : ["unknown","not_organism","sciarid","phorid","mite","springtail","myriapod"][k-1]) : pick;
  }
  if (API_BASE && S.incident) await fetch(API_BASE+"/api/correct",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({incident_id:S.incident,organism_index:i,feedback:fb,correction})});
  const el=document.getElementById("fb-"+i); if(el) el.innerHTML = fb==="confirm" ? "✅ ขอบคุณ บันทึกว่าตรงกับที่เห็น" : "📝 ขอบคุณ หมอเห็ดจะนำไปเรียนรู้";
}
function fbRow(i){ return `<div class="fb" id="fb-${i}">ตรงกับที่คุณเห็นไหม? <button onclick="feedback(${i},'confirm')">ใช่</button> · <button onclick="feedback(${i},'deny')">ไม่ใช่ตัวนี้</button></div>`; }
// Remember this phone's cases so we can ask "ดีขึ้นไหม" in-app even without LINE
function rememberCase(id){ const l=JSON.parse(localStorage.mh_cases||"[]"); l.push({id,at:Date.now()}); localStorage.mh_cases=JSON.stringify(l.slice(-10)); }
async function checkFollowups(){
  if (!API_BASE) return;
  const l=JSON.parse(localStorage.mh_cases||"[]"); const done=JSON.parse(localStorage.mh_done||"[]");
  for (const c of l){ if (done.includes(c.id) || Date.now()-c.at < 3*86400000) continue;
    try{ const f=await (await fetch(API_BASE+"/api/followup?incident="+c.id)).json(); if(!f.pending) continue;
      const box=document.createElement("section"); box.className="card"; box.style.borderLeft="6px solid var(--clinic)";
      box.innerHTML=`<div class="eyebrow">ติดตามผล</div><h2>${f.question_th}</h2><div class="chips" id="fu-${c.id}"></div>`;
      document.getElementById("s-intake").prepend(box);
      renderChips("fu-"+c.id, f.options.map(o=>({id:o.value,th:o.th})), async v=>{ await fetch(API_BASE+"/api/outcome",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({incident_id:c.id,outcome:v})}); done.push(c.id); localStorage.mh_done=JSON.stringify(done); box.innerHTML="<h2>ขอบคุณค่ะ หมอเห็ดบันทึกผลแล้ว</h2>"; setTimeout(()=>box.remove(),2500); });
      break; }catch(_){}
  }
}

  const el = document.getElementById("ver");

  if (typeof API_BASE !== "undefined" && API_BASE) {
    fetch(API_BASE + "/api/context").then(r => r.json())
      .then(c => paint(c && c.kb_meta ? c.kb_meta.kb_version : ""))
      .catch(() => {});
  }
})();
